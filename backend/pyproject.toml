[project]
name = "spaceport"
version = "0.1.0"
description = "Spaceport Charter System API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
